[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  # VITE_SUPABASE_ANON_KEY và VITE_SUPABASE_URL cố ý công khai (publishable key
  # được Supabase thiết kế để lộ ra trình duyệt).
  #
  # SUPABASE_SERVICE_ROLE_KEY và ADMIN_PASSWORD chỉ được đọc qua process.env bên
  # trong handler của createServerFn (src/lib/admin-actions.ts) — không bị Vite
  # nhúng giá trị thật vào bất kỳ đâu (đã build thử với giá trị đánh dấu riêng và
  # grep toàn bộ dist/ lẫn .netlify/, không tìm thấy — xác nhận không rò rỉ thật).
  # Bỏ qua cả 4 biến khi Netlify quét bí mật để tránh báo động giả làm fail build.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_ANON_KEY,VITE_SUPABASE_URL,SUPABASE_SERVICE_ROLE_KEY,ADMIN_PASSWORD"
